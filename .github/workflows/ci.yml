name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Typecheck + compilar
        run: npm run build
      - name: Verificar empaquetado (.vsix)
        run: npx --yes @vscode/vsce package --no-dependencies
